name: Publish course slides

on:
  push:
    branches:
      - main
    paths:
      - "slides/**"
      - "codes/**"
      - "scripts/check_setup.py"
      - "scripts/package-student-kit.py"
      - "scripts/package-day-2.py"
      - "docs/student-setup.md"
      - "environment-student.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Render slides
        run: quarto render slides

      - name: Package classroom code and data
        run: python3 scripts/package-student-kit.py

      - name: Package Day 2 classroom code and data
        run: python3 scripts/package-day-2.py

      - name: Make the setup guide the site landing page
        run: cp slides/_site/student-setup.html slides/_site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: slides/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
